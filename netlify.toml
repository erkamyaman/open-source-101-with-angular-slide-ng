[build]
publish = "dist"
command = "npm run build"

[build.environment]
NODE_VERSION = "24"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/tr"
to = "/1?lang=tr"
status = 302
force = true

[[redirects]]
from = "/en"
to = "/1?lang=en"
status = 302
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
