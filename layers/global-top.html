@if (no() > 2 && no() < nav.total - 2) {
  <div class="deck-footer">
    <div class="deck-id">
      <img src="erkamyaman.jpg" alt="" />
      <span>erKam</span>
    </div>
    @if (section(); as s) {
      <span class="deck-section">{{ s.number }} / {{ s.name }}</span>
    }
    @if (printNo() === null) {
      <slide-ng-timer class="deck-timer" />
    }
    <span class="deck-count">{{ no() }} / {{ nav.total }}</span>
  </div>
}
